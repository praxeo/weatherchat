name = "weather-chat"
main = "index.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

# Workers Logs: keeps each request's status, wall/CPU time and any exception
# (dashboard → Workers → weather-chat → Logs), so a hang or error can be
# traced after the fact. Free tier covers far more than one user generates.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
NWS_USER_AGENT = "WeatherChatBot/1.0 (contact@example.com)"
# Inference provider + model. PROVIDER picks the wire format; MODEL must be
# one that provider serves.
#   fireworks → GLM 5.3 Fast (Chat Completions, FIREWORKS_API_KEY)
#   meta      → MODEL = "muse-spark-1.3-contributor" (Responses API,
#               MODEL_API_KEY) — switch both lines together to roll back.
PROVIDER = "fireworks"
MODEL = "accounts/fireworks/routers/glm-5p3-fast"
DEFAULT_LAT = "33.21"
DEFAULT_LON = "-86.65"
DEFAULT_OFFICE = "BMX"
DEFAULT_LOCATION_NAME = "Shelby County, Alabama"
# Optional inference tuning (all have sensible defaults if unset):
#   REASONING_EFFORT — chat reasoning depth per tool round. Default "low" on
#     Fireworks (none/low/medium/high/xhigh/max), "minimal" on Meta
#     (minimal/low/medium/high/xhigh). Unsupported values move to the nearest
#     level the provider accepts.
#   SUMMARY_EFFORT — reasoning depth for the home-screen forecast discussion
#     (/api/summary), default "high". It's cached hourly and the app shows the
#     previous discussion while a new one generates, so depth is cheap here.
#   MAX_TOKENS — max output tokens per turn (default 8192).
#   SUMMARY_MODEL — model used for the at-a-glance home-screen forecast line
#     (/api/summary). Defaults to MODEL. Set a cheaper/faster model here to
#     decouple the one-liner from the main chat model.

# The active provider's key is a required secret (chat and summary both use
# it):
#   wrangler secret put FIREWORKS_API_KEY   # PROVIDER = "fireworks"
#   wrangler secret put MODEL_API_KEY       # PROVIDER = "meta"

# AIRNOW_API_KEY is a secret. Set it with:
#   wrangler secret put AIRNOW_API_KEY
# (without it, get_air_quality returns a helpful "not configured" message.)

# ELEVENLABS_API_KEY is a secret (voice: speech-to-text + spoken replies). Set
# it with:
#   wrangler secret put ELEVENLABS_API_KEY
# (without it, /api/transcribe and /api/tts return a "not configured" error and
# the rest of the app works normally.)
# Optional: ELEVENLABS_VOICE_ID overrides the default TTS voice (Rachel).
